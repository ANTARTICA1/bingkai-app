<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bingkaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Frame -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="none" stroke="url(#bingkaiGrad)" stroke-width="7" />
  <!-- Lens / Aperture / Inner Photo Corner -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#bingkaiGrad)" stroke-width="6" />
  <circle cx="68" cy="32" r="6" fill="url(#innerGrad)" />
  <!-- Corner Accent Pin -->
  <rect x="24" y="24" width="8" height="8" rx="2" fill="url(#innerGrad)" />
</svg>
